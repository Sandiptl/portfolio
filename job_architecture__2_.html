<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Architecture — Water Heater</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a1a;
    --ink-soft: #4a4a4a;
    --ink-mute: #888;
    --paper: #fbfaf7;
    --paper-2: #f4f1ea;
    --rule: #e6e1d6;
    --rule-soft: #ede9de;
    --accent: #C00000;
    /* Excel category palette: Core=red, Related=blue, Emotional=gold, Social=green, Consumption=purple */
    --core: #C00000;
    --core-bg: #f7d9d9;
    --related: #2E75B6;
    --related-bg: #dceaf6;
    --emotional: #BF8F00;
    --emotional-bg: #f7ecc6;
    --social: #548235;
    --social-bg: #e0ecd3;
    --consumption: #7030A0;
    --consumption-bg: #ead8f3;
    /* Action-verb pills */
    --max: #548235;
    --max-bg: #e0ecd3;
    --min: #C00000;
    --min-bg: #f7d9d9;
    --inc: #2E75B6;
    --inc-bg: #dceaf6;
    --red: #C00000;
    --red-bg: #f7d9d9;
    --avo: #BF8F00;
    --avo-bg: #f7ecc6;
    /* Opportunity heatmap tiers (matches Excel) */
    --opp-14: #E06666;
    --opp-13: #F4A261;
    --opp-12: #F6BE00;
    --opp-11: #FFE699;
    --opp-10: #D9EAD3;
    --opp-low: #C6E0B4;
    --opp-sat: #A9D08E;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--paper);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.55;
    min-height: 100vh;
  }

  /* HEADER */
  .masthead {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--paper);
    border-bottom: 1px solid var(--rule);
    padding: 16px 48px 0;
  }
  .masthead-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 10px;
  }
  .brand {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 19px;
    letter-spacing: -0.01em;
  }
  .brand-sub {
    color: var(--ink-mute);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-left: 14px;
  }
  .masthead-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .btn {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 7px 14px;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 100px;
    cursor: pointer;
    color: var(--ink);
    transition: all 0.15s;
  }
  .btn:hover { background: var(--paper-2); border-color: var(--ink-mute); }
  .btn-primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .btn-primary:hover { background: #000; border-color: #000; }
  .btn-danger { color: var(--red); border-color: var(--red-bg); }
  .btn-danger:hover { background: var(--red-bg); }
  .btn-sm { padding: 4px 10px; font-size: 11px; }

  /* CATEGORY TABS */
  .tabs {
    display: flex;
    gap: 28px;
    padding-bottom: 0;
  }
  .tab {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 500;
    color: var(--ink-mute);
    padding: 12px 2px;
    border: none;
    background: none;
    cursor: pointer;
    position: relative;
    transition: color 0.15s;
  }
  .tab:hover { color: var(--ink-soft); }
  .tab.active {
    color: var(--ink);
  }
  .tab.active::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 2px;
    background: var(--ink);
  }
  .tab-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-mute);
    margin-left: 4px;
    font-weight: 400;
  }

  /* PERSONA FILTER STRIP */
  .persona-bar {
    background: var(--paper-2);
    border-bottom: 1px solid var(--rule);
    padding: 14px 48px;
  }
  .persona-bar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .persona-bar-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--ink-mute);
    font-weight: 600;
  }
  .persona-bar-clear {
    font-size: 11px;
    color: var(--ink-mute);
    background: none;
    border: none;
    cursor: pointer;
    padding: 2px 6px;
  }
  .persona-bar-clear:hover { color: var(--ink); text-decoration: underline; }
  .persona-bar-clear.hidden { visibility: hidden; }
  .persona-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 5px 12px;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 100px;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .chip:hover {
    border-color: var(--ink-mute);
    color: var(--ink);
  }
  .chip.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .chip-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    opacity: 0.65;
    margin-left: 4px;
  }

  /* OPPORTUNITY FILTER BAR */
  .opp-bar {
    background: var(--paper);
    border-bottom: 1px solid var(--rule);
    padding: 12px 48px;
  }
  .opp-bar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .opp-bar-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--ink-mute);
    font-weight: 600;
  }
  .opp-bar-clear {
    font-size: 11px;
    color: var(--ink-mute);
    background: none;
    border: none;
    cursor: pointer;
    padding: 2px 6px;
  }
  .opp-bar-clear:hover { color: var(--ink); text-decoration: underline; }
  .opp-bar-clear.hidden { visibility: hidden; }
  .opp-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .opp-chip {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    padding: 5px 12px;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 100px;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--ink-soft);
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .opp-chip:hover {
    border-color: var(--ink-mute);
    color: var(--ink);
  }
  .opp-chip .opp-chip-swatch {
    width: 12px;
    height: 12px;
    border-radius: 3px;
    border: 1px solid rgba(0,0,0,0.08);
  }
  .opp-chip[data-tier="14"] .opp-chip-swatch { background: var(--opp-14); }
  .opp-chip[data-tier="13"] .opp-chip-swatch { background: var(--opp-13); }
  .opp-chip[data-tier="12"] .opp-chip-swatch { background: var(--opp-12); }
  .opp-chip.active[data-tier="14"] { background: var(--opp-14); color: #fff; border-color: var(--opp-14); }
  .opp-chip.active[data-tier="13"] { background: var(--opp-13); color: #fff; border-color: var(--opp-13); }
  .opp-chip.active[data-tier="12"] { background: var(--opp-12); color: #1a1a1a; border-color: var(--opp-12); }
  .opp-chip.active .opp-chip-swatch { display: none; }
  .opp-chip-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    opacity: 0.7;
  }

  /* MAIN */
  main {
    padding: 28px 48px 80px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .category-banner {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--ink-mute);
    padding: 18px 0 14px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  /* JOB CARD */
  .job {
    margin-bottom: 22px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--rule-soft);
  }
  .job:last-child { border-bottom: none; }

  .job-header {
    display: grid;
    grid-template-columns: 60px 1fr auto;
    gap: 20px;
    align-items: flex-start;
    margin-bottom: 10px;
  }
  .job-id {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-mute);
    padding-top: 4px;
  }
  .job-title-block {
    min-width: 0;
  }
  .job-title-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .tag {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 9px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .tag-Core { background: var(--core-bg); color: var(--core); }
  .tag-Emotional { background: var(--emotional-bg); color: var(--emotional); }
  .tag-Social { background: var(--social-bg); color: var(--social); }
  .tag-Consumption { background: var(--consumption-bg); color: var(--consumption); }
  .tag-Related { background: var(--related-bg); color: var(--related); }
  .job-title {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 500;
    line-height: 1.1;
    letter-spacing: -0.01em;
    color: var(--ink);
    margin: 0;
  }
  .job-subsection {
    font-size: 11px;
    color: var(--ink-mute);
    font-style: italic;
    margin-top: 4px;
  }
  .job-controls {
    display: flex;
    gap: 4px;
    align-items: center;
  }
  .icon-btn {
    width: 28px;
    height: 28px;
    border: 1px solid var(--rule);
    background: var(--paper);
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-soft);
    transition: all 0.15s;
    padding: 0;
  }
  .icon-btn:hover { background: var(--paper-2); color: var(--ink); }
  .icon-btn.delete:hover { background: var(--red-bg); color: var(--red); border-color: var(--red-bg); }
  .icon-btn svg { width: 14px; height: 14px; }

  /* PERSONA ROW */
  .persona-row {
    margin-left: 80px;
    padding: 6px 12px;
    background: var(--paper-2);
    border-radius: 6px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    align-items: center;
    margin-bottom: 10px;
    line-height: 1.15;
  }
  .persona-row-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-mute);
    font-weight: 600;
    margin-right: 6px;
  }
  .persona-pill {
    font-size: 11px;
    padding: 3px 9px;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 100px;
    color: var(--ink-soft);
    cursor: default;
    transition: all 0.15s;
  }
  .persona-pill.highlighted {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
    font-weight: 500;
  }

  /* STEPS TABLE */
  .steps {
    margin-left: 80px;
    border-top: 1px solid var(--rule);
    /* Scrollable region: rows scroll vertically, header stays pinned at top */
    max-height: 420px;
    overflow-y: auto;
    overflow-x: hidden;
    /* Subtle inset so the scrollbar doesn't sit against the right edge */
    border-right: 1px solid transparent;
  }
  /* Custom scrollbar to match the paper aesthetic */
  .steps::-webkit-scrollbar { width: 8px; }
  .steps::-webkit-scrollbar-track { background: transparent; }
  .steps::-webkit-scrollbar-thumb {
    background: var(--rule);
    border-radius: 4px;
  }
  .steps::-webkit-scrollbar-thumb:hover { background: var(--ink-mute); }
  .steps-header {
    display: grid;
    grid-template-columns: 90px 1fr 1fr 52px 52px 60px;
    gap: 14px;
    padding: 9px 0;
    border-bottom: 1px solid var(--rule);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-mute);
    font-weight: 600;
    /* Pin the header at the top of the scrollable .steps container */
    position: sticky;
    top: 0;
    background: var(--paper);
    z-index: 5;
  }
  .steps-header .col-score { text-align: center; }
  .step-row {
    display: grid;
    grid-template-columns: 90px 1fr 1fr 52px 52px 60px;
    gap: 14px;
    padding: 8px 0;
    border-bottom: 1px solid var(--rule-soft);
    align-items: flex-start;
  }
  .step-row:last-child { border-bottom: none; }
  .step-row.step-hidden { display: none; }
  .job.job-hidden { display: none; }
  .step-name {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--ink);
    font-weight: 400;
    line-height: 1.15;
  }
  .step-desc {
    font-size: 13.5px;
    color: var(--ink);
    line-height: 1.15;
    white-space: pre-wrap;
  }
  .step-ods {
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.15;
    white-space: pre-wrap;
  }
  .ods-line {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    margin-bottom: 2px;
  }
  .ods-line:last-child { margin-bottom: 0; }
  .score-cell {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 1px;
  }
  .score-val {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 38px;
    height: 26px;
    padding: 2px 6px;
    border: 1px solid var(--rule);
    border-radius: 4px;
    background: var(--paper);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--ink);
    font-weight: 600;
  }
  .opp-val {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 46px;
    height: 26px;
    padding: 2px 6px;
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    color: #1a1a1a;
  }
  .opp-val.opp-tier-14 { background: var(--opp-14); color: #fff; }
  .opp-val.opp-tier-13 { background: var(--opp-13); color: #fff; }
  .opp-val.opp-tier-12 { background: var(--opp-12); }
  .opp-val.opp-tier-11 { background: var(--opp-11); }
  .opp-val.opp-tier-10 { background: var(--opp-10); }
  .opp-val.opp-tier-low { background: var(--opp-low); }
  .opp-val.opp-tier-saturated { background: var(--opp-sat); }
  .ods-badge {
    flex-shrink: 0;
    font-family: 'Inter', sans-serif;
    font-size: 9.5px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 1px;
  }
  .ods-badge-Max { background: var(--max-bg); color: var(--max); }
  .ods-badge-Min { background: var(--min-bg); color: var(--min); }
  .ods-badge-Inc { background: var(--inc-bg); color: var(--inc); }
  .ods-badge-Red { background: var(--red-bg); color: var(--red); }
  .ods-badge-Avo { background: var(--avo-bg); color: var(--avo); }
  .ods-text { flex: 1; }

  /* EDITABLE STATES */
  [contenteditable="true"] {
    outline: 2px dashed var(--accent);
    outline-offset: 2px;
    background: #fffbf6;
    border-radius: 2px;
    padding: 2px 4px;
    margin: -2px -4px;
  }
  [contenteditable="true"]:focus { outline-style: solid; }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(26, 26, 26, 0.55);
    backdrop-filter: blur(4px);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--paper);
    border-radius: 8px;
    padding: 32px;
    max-width: 540px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 20px 50px rgba(0,0,0,0.2);
  }
  .modal h2 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 24px;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  .modal-sub {
    color: var(--ink-mute);
    font-size: 13px;
    margin-bottom: 20px;
  }
  .form-row { margin-bottom: 14px; }
  .form-row label {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-mute);
    margin-bottom: 5px;
    font-weight: 600;
  }
  .form-row input,
  .form-row select,
  .form-row textarea {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--rule);
    border-radius: 4px;
    background: var(--paper);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--ink);
    font-weight: 400;
  }
  .form-row input:focus,
  .form-row select:focus,
  .form-row textarea:focus {
    outline: none;
    border-color: var(--ink);
  }
  .form-row textarea { resize: vertical; min-height: 70px; }
  .persona-checklist {
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 10px 12px;
    max-height: 220px;
    overflow-y: auto;
    background: var(--paper);
  }
  .persona-check {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
    font-size: 12px;
    cursor: pointer;
  }
  .persona-check input { width: auto; }
  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--rule);
  }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--ink-mute);
  }
  .empty-state h3 {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 500;
    color: var(--ink);
    margin: 0 0 8px;
  }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--paper);
    padding: 10px 18px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 500;
    opacity: 0;
    transition: all 0.25s ease;
    pointer-events: none;
    z-index: 300;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* SAVE INDICATOR */
  .save-indicator {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--ink-mute);
  }
  .save-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--social);
  }
  .save-dot.dirty { background: var(--accent); animation: pulse 1.4s infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* RESPONSIVE */
  @media (max-width: 1100px) {
    .steps-header { grid-template-columns: 80px 1fr 1fr 44px 44px 52px; gap: 10px; }
    .step-row { grid-template-columns: 80px 1fr 1fr 44px 44px 52px; gap: 10px; }
    .score-val { min-width: 32px; }
    .opp-val { min-width: 40px; }
  }
  @media (max-width: 900px) {
    .masthead, .persona-bar, .opp-bar, main { padding-left: 20px; padding-right: 20px; }
    .job-header { grid-template-columns: 40px 1fr; }
    .job-controls { grid-column: 1 / -1; margin-left: 40px; }
    .persona-row, .steps { margin-left: 0; }
    .steps-header { grid-template-columns: 70px 1fr 44px 44px 52px; gap: 8px; }
    .steps-header .col-ods { display: none; }
    .step-row { grid-template-columns: 70px 1fr 44px 44px 52px; grid-template-rows: auto auto; gap: 8px; }
    .step-row .step-ods { grid-column: 2 / span 4; }
    .tabs { gap: 16px; overflow-x: auto; }
    .tab { font-size: 14px; white-space: nowrap; }
  }
    /* Download CSV button — sits beside "Clear all" in the opportunity bar */
    .opp-bar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

ikelihood of mis-sizing flow for the fixture."}, {"name": "Locate", "description": "Sense the open tap or appliance call signal and locate the hot outlet path.", "ods": "Minimize the time it takes to detect a tap-open signal.\nMaximize the reliability of demand signal recognition.\nMinimize the likelihood of routing flow through the wrong outlet path."}, {"name": "Prepare", "description": "Open outlet valves, pressurize the line, and prime the delivery pipe.", "ods": "Minimize the time it takes to pressurize the delivery line.\nMaximize the smoothness of valve actuation.\nMinimize the likelihood of pressure spikes at line opening."}, {"name": "Confirm", "description": "Confirm inlet pressure, no airlocks, and a clear path to the fixture.", "ods": "Minimize the likelihood of airlocks remaining in the delivery line.\nMaximize the verification coverage of the outlet path before flow.\nMinimize the time it takes to confirm delivery readiness."}, {"name": "Execute", "description": "Push hot water from the tank to the outlet at consistent pressure and flow.", "ods": "Maximize the consistency of delivered pressure and flow at the fixture.\nMinimize the variation in outlet temperature during continuous draw.\nMinimize the wait time at the fixture for hot water arrival."}, {"name": "Monitor", "description": "Monitor outlet temperature and flow stability during the draw.", "ods": "Minimize the lag in detecting outlet temperature changes during draw.\nMaximize the frequency of pressure stability checks.\nMinimize the likelihood of missed temperature sag events."}, {"name": "Modify", "description": "Open cold inlet to replenish the tank and avoid pressure drop or temperature sag.", "ods": "Minimize the magnitude of pressure drop when the cold inlet opens.\nMinimize the time it takes to compensate for tank depletion.\nMaximize the smoothness of inlet flow modulation."}, {"name": "Conclude", "description": "Close outlet on demand cessation and re-pressurize the system for next us let state = {
  jobs: [],
  activeCategory: 'All',
  selectedPersonas: new Set(),
  selectedOpps: new Set(),
  editingJobId: null,
};

// Opportunity tier class for heatmap coloring
function oppTierClass(opp) {
  if (typeof opp !== 'number' || isNaN(opp)) return '';
  if (opp >= 14) return 'opp-tier-14';
  if (opp === 13) return 'opp-tier-13';
  if (opp === 12) return 'opp-tier-12';
  if (opp === 11) return 'opp-tier-11';
  if (opp === 10) return 'opp-tier-10';
  if (opp >= 8) return 'opp-tier-low';
  return 'opp-tier-saturated';
}

// ============ DOWNLOAD CSV (job × step × ODS with Opp scores) ============
// Builds a flat CSV from state.jobs (falls back to SEED_DATA if state hasn't
// hydrated yet). One row per ODS sentence keeps it Excel-friendly.
function csvEscape(v) {
  if (v == null) return '';
  const s = String(v);
  // Wrap in quotes if it contains comma, quote, CR or LF; escape internal quotes.
  if (/[",\r\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function buildJobsCsv() {
  const jobs = (state && state.jobs && state.jobs.length) ? state.jobs : SEED_DATA;
  const headers = [
    'Job ID', 'Category', 'Subsection', 'Job Title',
    'Step #', 'Step Name', 'Step Description',
    'Importance (1-10)', 'Satisfaction (1-10)', 'Opportunity Score',
    'ODS Line #', 'ODS Statement'
  ];
  const rows = [headers];

  jobs.forEach(job => {
    (job.steps || []).forEach((step, stepIdx) => {
      const imp = (typeof step.importance === 'number') ? step.importance : '';
      const sat = (typeof step.satisfaction === 'number') ? step.satisfaction : '';
      let opp = '';
      if (imp !== '' && sat !== '') {
        opp = imp + Math.max(imp - sat, 0);
      }
      // Split ODS into lines; if blank, still emit one row so the step shows up.
      const odsLines = (step.ods || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      if (odsLines.length === 0) {
        rows.push([
          job.id, job.category || '', job.subsection || '', job.title || '',
          (stepIdx + 1), step.name || '', step.description || '',
          imp, sat, opp,
          '', ''
        ]);
      } else {
        odsLines.forEach((line, lineIdx) => {
          rows.push([
            job.id, job.category || '', job.subsection || '', job.title || '',
            (stepIdx + 1), step.name || '', step.description || '',
            imp, sat, opp,
            (lineIdx + 1), line
          ]);
        });
      }
    });
  });

  return rows.map(r => r.map(csvEscape).join(',')).join('\r\n');
}

function downloadJobsCsv() {
  const btn = document.getElementById('downloadCsvBtn');
  if (btn) btn.classList.add('is-downloading');
  try {
    const csv = buildJobsCsv();
    // Prepend UTF-8 BOM so Excel opens it with the right encoding.
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const ts = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `job_architecture_ods_opp_${ts}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (e) {
    console.error('CSV download failed:', e);
    alert('CSV download failed. See console for details.');
  } finally {
    if (btn) {
      setTimeout(() => btn.classList.remove('is-downloading'), 300);
    }
  }
}


// ============ STORAGE (persistent) ============
function migrateJobs(jobs) {
  // Inject pre-scored Importance/Satisfaction per job × step from the SCORES table.
  // Every step is overwritten with the canonical scored values.
  jobs.forEach(j => {
    const jobScores = SCORES[j.id];
    (j.steps || []).forEach((s, idx) => {
      if (jobScores && jobScores[idx]) {
        s.importance = jobScores[idx][0];
        s.satisfaction = jobScores[idx][1];
      } else {
        if (!('importance' in s)) s.importance = null;
        if (!('satisfaction' in s)) s.satisfaction = null;
      }
    });
  });
  return jobs;
}

async function loadData() {
  try {
    const result = await window.storage.get(STORAGE_KEY);
    if (result && result.value) {
      const parsed = JSON.parse(result.value);
      if (Array.isArray(parsed) && parsed.length > 0) {
        state.jobs = migrateJobs(parsed);
        markSaved();
        return;
      }
    }
  } catch (e) {
    // No saved data — fall through to seed
  }
  // First load — use seed and persist
  state.jobs = migrateJobs(JSON.parse(JSON.stringify(SEED_DATA)));
  await saveData();
}

async function saveData() {
  markDirty();
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify(state.jobs));
    markSaved();
  } catch (e) {
    console.error('Save failed', e);
    showToast('Save failed — changes may be lost');
  }
}

function markDirty() {
  document.getElementById('saveDot').classList.add('dirty');
  document.getElementById('saveLabel').textContent = 'Saving…';
}
function markSaved() {
  document.getElementById('saveDot').classList.remove('dirty');
  document.getElementById('saveLabel').textContent = 'Saved';
}

// ============ HELPERS ============
function uid() {
  return 'J' + Date.now().toString(36) + Math.floor(Math.random() * 1000).toString(36);
}

function nextJobNumericId() {
  // For display only — compact J-numbering
  const nums = state.jobs.map(j => parseInt((j.id || '').replace(/\D/g, ''), 10)).filter(n => !isNaN(n));
  return nums.length ? Math.max(...nums) + 1 : 1;
}

function getAllPersonas() {
  const set = new Set();
  state.jobs.forEach(j => (j.personas || []).forEach(p => set.add(p)));
  return Array.from(set).sort((a, b) => personaShort(a).localeCompare(personaShort(b)));
}

function personaShort(p) {
  return (p.split(' — ')[0] || p).trim();
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

// Parse ODS string into individual lines with badge categorization
function parseOdsLines(ods) {
  if (!ods) return [];
  return ods.split('\n').map(l => l.trim()).filter(Boolean).map(line => {
    const lower = line.toLowerCase();
    let badge = 'Max';
    if (lower.startsWith('minimize')) badge = 'Min';
    else if (lower.startsWith('maximize')) badge = 'Max';
    else if (lower.startsWith('increase')) badge = 'Inc';
    else if (lower.startsWith('reduce')) badge = 'Red';
    else if (lower.startsWith('avoid')) badge = 'Avo';
    return { badge, text: line };
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.remove('show'), 2400);
}

// ============ RENDER ============
function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const count = cat === 'All' ? state.jobs.length : state.jobs.filter(j => j.category === cat).length;
    const btn = document.createElement('button');
    btn.className = 'tab' + (state.activeCategory === cat ? ' active' : '');
    btn.innerHTML = `${cat}<span class="tab-count">${count}</span>`;
    btn.onclick = () => { state.activeCategory = cat; render(); };
    tabs.appendChild(btn);
  });
}

function renderPersonaChips() {
  const container = document.getElementById('personaChips');
  container.innerHTML = '';
  const all = getAllPersonas();

  // Each chip with count of how many CURRENTLY visible (category-filtered) jobs it appears in
  const baseJobs = state.activeCategory === 'All'
    ? state.jobs
    : state.jobs.filter(j => j.category === state.activeCategory);

  all.forEach(p => {
    const count = baseJobs.filter(j => (j.personas || []).includes(p)).length;
    const chip = document.createElement('button');
    chip.className = 'chip' + (state.selectedPersonas.has(p) ? ' active' : '');
    chip.innerHTML = `${escapeHtml(personaShort(p))}<span class="chip-count">${count}</span>`;
    chip.onclick = () => {
      if (state.selectedPersonas.has(p)) state.selectedPersonas.delete(p);
      else state.selectedPersonas.add(p);
      render();
    };
    container.appendChild(chip);
  });

  document.getElementById('clearPersonas').classList.toggle('hidden', state.selectedPersonas.size === 0);
}

function renderOppChips() {
  // Counting respects active category and persona filters so the numbers reflect what's actually shown
  let pool = state.jobs;
  if (state.activeCategory !== 'All') {
    pool = pool.filter(j => j.category === state.activeCategory);
  }
  if (state.selectedPersonas.size > 0) {
    pool = pool.filter(j =>
      Array.from(state.selectedPersonas).some(p => (j.personas || []).includes(p))
    );
  }

  const counts = { 12: 0, 13: 0, 14: 0 };
  pool.forEach(j => {
    (j.steps || []).forEach(s => {
      if (s.importance == null || s.satisfaction == null) return;
      const opp = s.importance + Math.max(s.importance - s.satisfaction, 0);
      if (opp >= 14) counts[14]++;
      else if (opp === 13) counts[13]++;
      else if (opp === 12) counts[12]++;
    });
  });

  document.getElementById('oppCount14').textContent = counts[14];
  document.getElementById('oppCount13').textContent = counts[13];
  document.getElementById('oppCount12').textContent = counts[12];

  document.querySelectorAll('#oppChips .opp-chip').forEach(chip => {
    const tier = parseInt(chip.dataset.tier, 10);
    chip.classList.toggle('active', state.selectedOpps.has(tier));
    chip.onclick = () => {
      if (state.selectedOpps.has(tier)) state.selectedOpps.delete(tier);
      else state.selectedOpps.add(tier);
      render();
    };
  });

  document.getElementById('clearOpps').classList.toggle('hidden', state.selectedOpps.size === 0);
}

function renderJobs() {
  const main = document.getElementById('main');
  main.innerHTML = '';

  // Filter
  let visible = state.jobs;
  if (state.activeCategory !== 'All') {
    visible = visible.filter(j => j.category === state.activeCategory);
  }
  if (state.selectedPersonas.size > 0) {
    visible = visible.filter(j =>
      Array.from(state.selectedPersonas).some(p => (j.personas || []).includes(p))
    );
  }
  // Opportunity filter — hide jobs whose every step falls outside selected tiers
  if (state.selectedOpps && state.selectedOpps.size > 0) {
    const wanted = state.selectedOpps;
    visible = visible.filter(j => {
      return (j.steps || []).some(s => {
        if (s.importance == null || s.satisfaction == null) return false;
        const opp = s.importance + Math.max(s.importance - s.satisfaction, 0);
        let tier = null;
        if (opp >= 14) tier = 14;
        else if (opp === 13) tier = 13;
        else if (opp === 12) tier = 12;
        return tier !== null && wanted.has(tier);
      });
    });
  }

  if (visible.length === 0) {
    main.innerHTML = `
      <div class="empty-state">
        <h3>No matching jobs</h3>
        <p>Try a different category or clear filters.</p>
      </div>`;
    return;
  }

  // Banner
  const banner = document.createElement('div');
  banner.className = 'category-banner';
  const filterNotes = [];
  if (state.selectedPersonas.size > 0) {
    filterNotes.push(`${state.selectedPersonas.size} persona${state.selectedPersonas.size > 1 ? 's' : ''}`);
  }
  if (state.selectedOpps && state.selectedOpps.size > 0) {
    const tiers = Array.from(state.selectedOpps).sort((a,b) => b - a).map(t => t === 14 ? '≥14' : String(t));
    filterNotes.push(`Opp ${tiers.join(', ')}`);
  }
  const filterNote = filterNotes.length ? ' · filtered by ' + filterNotes.join(' + ') : '';
  banner.innerHTML = `
    <span>${state.activeCategory === 'All' ? 'All Jobs' : state.activeCategory + ' Jobs'}${filterNote}</span>
    <span>${visible.length} result${visible.length !== 1 ? 's' : ''}</span>
  `;
  main.appendChild(banner);

  visible.forEach((job, idx) => {
    main.appendChild(renderJobCard(job, idx + 1));
  });
}

function renderJobCard(job, displayIdx) {
  const card = document.createElement('article');
  card.className = 'job';
  card.dataset.jobId = job.id;

  const cat = job.category || 'Related';

  // Compute the canonical "ID label" (C6, R5, E2, S13, CN8) that matches the Excel scoring sheet.
  // Most titles start with a number ("6. Maintain..."), use that. Consumption jobs (J54-J65)
  // have no number prefix; derive the per-category index from the J-id range.
  // J1-J9 = C1-C9, J10-J26 = R1-R17, J27-J40 = E1-E14, J41-J53 = S1-S13, J54-J65 = CN1-CN12.
  const titleMatch = (job.title || '').match(/^(\d+)\./);
  let canonicalNum;
  if (titleMatch) {
    canonicalNum = titleMatch[1];
  } else {
    const jNum = parseInt((job.id || '').replace(/^J/, ''), 10);
    if (jNum >= 1 && jNum <= 9) canonicalNum = String(jNum);
    else if (jNum >= 10 && jNum <= 26) canonicalNum = String(jNum - 9);
    else if (jNum >= 27 && jNum <= 40) canonicalNum = String(jNum - 26);
    else if (jNum >= 41 && jNum <= 53) canonicalNum = String(jNum - 40);
    else if (jNum >= 54 && jNum <= 65) canonicalNum = String(jNum - 53);
    else canonicalNum = String(jNum || '');
  }
  // Consumption uses "CN" prefix, others use first letter of category
  const prefix = cat === 'Consumption' ? 'CN' : cat.charAt(0);
  const jobIdLabel = `${prefix}${canonicalNum}`;

  // Header
  const subsectionHtml = job.subsection ? `<div class="job-subsection">${escapeHtml(job.subsection)}</div>` : '';

  card.innerHTML = `
    <div class="job-header">
      <div class="job-id">${jobIdLabel}</div>
      <div class="job-title-block">
        <div class="job-title-row">
          <span class="tag tag-${escapeHtml(cat)}">${escapeHtml(cat)}</span>
        </div>
        <h2 class="job-title" data-field="title" data-job-id="${job.id}">${escapeHtml(job.title)}</h2>
        ${subsectionHtml}
      </div>
      <div class="job-controls">
        <button class="icon-btn" title="Edit personas & category" data-action="edit" data-job-id="${job.id}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="icon-btn delete" title="Delete job" data-action="delete" data-job-id="${job.id}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
    </div>

    <div class="persona-row">
      <span class="persona-row-label">Personas</span>
      ${(job.personas || []).map(p => {
        const highlighted = state.selectedPersonas.has(p) ? ' highlighted' : '';
        return `<span class="persona-pill${highlighted}" title="${escapeHtml(p)}">${escapeHtml(personaShort(p))}</span>`;
      }).join('')}
    </div>

    <div class="steps">
      <div class="steps-header">
        <div>Step</div>
        <div>Job Being Done</div>
        <div class="col-ods">Outcome Statement</div>
        <div class="col-score" title="Importance (1–10): how important is this outcome to the user?">Imp</div>
        <div class="col-score" title="Satisfaction (1–10): how well does the current solution deliver?">Sat</div>
        <div class="col-score" title="Opportunity = Importance + max(Importance − Satisfaction, 0)">Opp</div>
      </div>
      ${(job.steps || []).map((s, i) => {
        const imp = s.importance ?? '';
        const sat = s.satisfaction ?? '';
        const impN = Number(imp), satN = Number(sat);
        const hasBoth = (imp !== '' && sat !== '' && !isNaN(impN) && !isNaN(satN));
        const opp = hasBoth ? (impN + Math.max(impN - satN, 0)) : '';
        const oppCls = hasBoth ? oppTierClass(opp) : '';
        // Hide row if opportunity filter active and this step's opp tier isn't selected
        let stepHidden = '';
        if (state.selectedOpps && state.selectedOpps.size > 0) {
          // Tier mapping: 14+ → 14, 13 → 13, 12 → 12, else not matching
          let tier = null;
          if (hasBoth) {
            if (opp >= 14) tier = 14;
            else if (opp === 13) tier = 13;
            else if (opp === 12) tier = 12;
          }
          if (tier === null || !state.selectedOpps.has(tier)) stepHidden = ' step-hidden';
        }
        return `
        <div class="step-row${stepHidden}" data-step-opp="${hasBoth ? opp : ''}">
          <div class="step-name">${escapeHtml(s.name || STEP_NAMES[i] || '')}</div>
          <div class="step-desc" data-field="step-desc" data-job-id="${job.id}" data-step-idx="${i}">${escapeHtml(s.description || '')}</div>
          <div class="step-ods">
            ${parseOdsLines(s.ods).map(ol => `
              <div class="ods-line">
                <span class="ods-badge ods-badge-${ol.badge}">${ol.badge}</span>
                <span class="ods-text">${escapeHtml(ol.text)}</span>
              </div>
            `).join('')}
            <div style="display:none" data-field="step-ods" data-job-id="${job.id}" data-step-idx="${i}">${escapeHtml(s.ods || '')}</div>
          </div>
          <div class="score-cell">
            <span class="score-val" title="Importance (1–10)">${imp === '' ? '–' : imp}</span>
          </div>
          <div class="score-cell">
            <span class="score-val" title="Satisfaction (1–10)">${sat === '' ? '–' : sat}</span>
          </div>
          <div class="score-cell">
            <span class="opp-val ${oppCls}" title="Opportunity Score">${opp === '' ? '–' : opp}</span>
          </div>
        </div>`;
      }).join('')}
    </div>
  `;

  return card;
}

function render() {
  renderTabs();
  renderPersonaChips();
  renderOppChips();
  renderJobs();
  attachEditableHandlers();
  attachJobActions();
}

// ============ INLINE EDITING ============
function attachEditableHandlers() {
  // Title and step descriptions are inline-editable on double click
  document.querySelectorAll('[data-field="title"], [data-field="step-desc"]').forEach(el => {
    el.addEventListener('dblclick', () => {
      el.setAttribute('contenteditable', 'true');
      el.focus();
      // Place cursor at end
      const range = document.createRange();
      range.selectNodeContents(el);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    });
    el.addEventListener('blur', () => {
      if (el.getAttribute('contenteditable') !== 'true') return;
      el.removeAttribute('contenteditable');
      const jobId = el.dataset.jobId;
      const field = el.dataset.field;
      const job = state.jobs.find(j => j.id === jobId);
      if (!job) return;
      const newText = el.textContent.trim();
      if (field === 'title') {
        if (job.title !== newText) { job.title = newText; saveData(); showToast('Title updated'); }
      } else if (field === 'step-desc') {
        const i = parseInt(el.dataset.stepIdx, 10);
        if (job.steps[i].description !== newText) {
          job.steps[i].description = newText;
          saveData();
          showToast('Step updated');
        }
      }
    });
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); el.blur(); }
      if (e.key === 'Escape') { el.removeAttribute('contenteditable'); render(); }
    });
    el.title = 'Double-click to edit';
    el.style.cursor = 'text';
  });
}

function attachJobActions() {
  document.querySelectorAll('[data-action]').forEach(btn => {
    btn.onclick = () => {
      const action = btn.dataset.action;
      const jobId = btn.dataset.jobId;
      if (action === 'edit') openEditModal(jobId);
      else if (action === 'delete') deleteJob(jobId);
    };
  });
}

// ============ MODAL ============
function openModal(jobId = null) {
  state.editingJobId = jobId;
  const job = jobId ? state.jobs.find(j => j.id === jobId) : null;

  document.getElementById('modalTitle').textContent = job ? 'Edit Job' : 'New Job';
  document.getElementById('modalSub').textContent = job
    ? 'Update title, category, subsection, and personas. Step details are edited inline.'
    : 'Define a job with its category, personas, and 8 process steps (auto-created).';
  document.getElementById('fTitle').value = job ? job.title : '';
  document.getElementById('fCategory').value = job ? job.category : 'Core';
  document.getElementById('fSubsection').value = job ? (job.subsection || '') : '';

  // Populate persona checklist with master cast + any extras already in data
  const allP = getAllPersonas();
  const selected = new Set(job ? job.personas : []);
  const list = document.getElementById('fPersonas');
  list.innerHTML = allP.map(p => `
    <label class="persona-check">
      <input type="checkbox" value="${escapeHtml(p)}"${selected.has(p) ? ' checked' : ''}>
      <span>${escapeHtml(p)}</span>
    </label>
  `).join('');

  document.getElementById('jobModal').classList.add('open');
  document.getElementById('fTitle').focus();
}
function openEditModal(jobId) { openModal(jobId); }
function closeModal() {
  document.getElementById('jobModal').classList.remove('open');
  state.editingJobId = null;
}

async function saveModal() {
  const title = document.getElementById('fTitle').value.trim();
  const category = document.getElementById('fCategory').value;
  const subsection = document.getElementById('fSubsection').value.trim() || null;
  if (!title) { showToast('Title is required'); return; }

  const personas = Array.from(document.querySelectorAll('#fPersonas input:checked')).map(i => i.value);

  if (state.editingJobId) {
    const job = state.jobs.find(j => j.id === state.editingJobId);
    if (job) {
      job.title = title;
      job.category = category;
      job.subsection = subsection;
      job.personas = personas;
    }
    showToast('Job updated');
  } else {
    const newJob = {
      id: uid(),
      category,
      subsection,
      title,
      personas,
      steps: STEP_NAMES.map(n => ({ name: n, description: '', ods: '' })),
    };
    state.jobs.push(newJob);
    showToast('Job created — double-click steps to fill them in');
  }

  await saveData();
  closeModal();
  render();
}

async function deleteJob(jobId) {
  const job = state.jobs.find(j => j.id === jobId);
  if (!job) return;
  if (!confirm(`Delete this job?\n\n"${job.title.slice(0, 100)}"\n\nThis cannot be undone.`)) return;
  state.jobs = state.jobs.filter(j => j.id !== jobId);
  await saveData();
  render();
  showToast('Job deleted');
}

// ============ EXPORT ============
function exportJson() {
  const blob = new Blob([JSON.stringify(state.jobs, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'job_architecture.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('Exported JSON');
}

// ============ INIT ============
async function init() {
  await loadData();
  render();

  document.getElementById('addJobBtn').onclick = () => openModal(null);
  document.getElementById('clearPersonas').onclick = () => {
    state.selectedPersonas.clear();
    render();
  };
  const _dlBtn = document.getElementById('downloadCsvBtn');
  if (_dlBtn) _dlBtn.addEventListener('click', downloadJobsCsv);
  document.getElementById('clearOpps').onclick = () => {
    state.selectedOpps.clear();
    render();
  };
  document.getElementById('cancelModal').onclick = closeModal;
  document.getElementById('saveModal').onclick = saveModal;
  document.getElementById('exportBtn').onclick = exportJson;
  document.getElementById('jobModal').onclick = (e) => {
    if (e.target.id === 'jobModal') closeModal();
  };
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.getElementById('jobModal').classList.contains('open')) {
      closeModal();
    }
  });
}
init();
</script>
